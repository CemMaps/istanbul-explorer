<!doctype html><meta charset="utf-8"><title>Study area outline</title>
<style>body{margin:0;font:14px system-ui;background:#fff}svg{width:48%;height:96vh}</style>
<div id="o"></div>
<script>
const draw = (fc, label) => {
  const g = fc.features[0].geometry; const rings = g.type === "Polygon" ? [g.coordinates[0]] : g.coordinates.map((p) => p[0]);
  const [x0, x1, y0, y1] = [28.86, 29.24, 40.94, 41.28], k = 84 / 111.1;
  const W = 400, H = W * (y1 - y0) / ((x1 - x0) * k);
  const d = rings.map((r) => "M" + r.map(([x, y]) => `${((x - x0) / (x1 - x0) * W).toFixed(1)},${((y1 - y) / (y1 - y0) * H).toFixed(1)}`).join("L") + "Z").join("");
  return `<svg viewBox="0 0 ${W} ${H}"><text x="8" y="18">${label}</text><path d="${d}" fill="#1F4FA322" stroke="#1F4FA3" stroke-width="1.5"/></svg>`;
};
Promise.all(["../data/raw/study_area_v1.geojson", "../data/study_area.geojson"].map((u) => fetch(u).then((r) => r.json())))
  .then(([a, b]) => (document.getElementById("o").innerHTML = draw(a, "v1") + draw(b, "v2")));
</script>
