<!doctype html>
<html lang="en" class="booting">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="">
  <meta name="description" content="Our family's map of Istanbul: photos, favourites and a loose plan for each day.">
  <title>Istanbul Explorer</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="icons/favicon-64.png" sizes="64x64" type="image/png">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Istanbul Explorer">
  <meta property="og:description" content="Our map of Istanbul: photos, favourites and routes for each day.">
  <meta property="og:image" content="https://explore-istanbul.vercel.app/app/icons/icon-512.png">
  <meta property="og:url" content="https://explore-istanbul.vercel.app/">
  <meta property="og:image:width" content="512">
  <meta property="og:image:height" content="512">
  <meta name="twitter:card" content="summary">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Istanbul">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <style>html.booting body > * { visibility: hidden; }</style>
  <script>
    // App height (2026-11-06): installed on iPhone, 100% / 100dvh can come out shorter than the screen,
    // leaving a band at the bottom. Full-screen home-screen apps use the real screen height instead.
    (function () {
      // iOS 26 home-screen apps leave a gap the size of the status bar; the standalone checks are not reliable there,
      // so: on an iPhone in portrait, a shortfall of up to 100 px against the screen means "full screen app, fill it".
      // (Safari with its toolbars falls short by far more, so the browser is left alone.)
      var ios = /iPhone|iPod/.test(navigator.userAgent) || typeof navigator.standalone === "boolean";
      function setH() {
        var standalone = navigator.standalone === true || matchMedia("(display-mode: standalone)").matches || matchMedia("(display-mode: fullscreen)").matches;
        var h = Math.max(window.innerHeight, document.documentElement.clientHeight || 0);
        var portrait = window.innerWidth < screen.height;
        var gap = screen.height - h;
        var app = portrait && gap > 0 && (standalone || (ios && gap <= 100));
        if (app) h = screen.height;
        document.documentElement.classList.toggle("is-fullapp", app || standalone);
        document.documentElement.style.setProperty("--app-h", h + "px");
      }
      setH();
      addEventListener("resize", setH);
      // No page zoom (2026-11-06, Cem): pinching a list or the splash zoomed the whole app and threw the layout off.
      // iOS ignores user-scalable=no in places, so block its pinch gestures and double-tap zoom too; the map has its own pinch.
      // (2026-11-08: no page-wide touchmove listener any more, and the map's own pinch is never touched;
      // CSS touch-action: pan-x pan-y does the rest.)
      ["gesturestart", "gesturechange"].forEach(function (t) {
        document.addEventListener(t, function (e) {
          if (!(e.target && e.target.closest && e.target.closest(".maplibregl-map"))) e.preventDefault();
        }, { passive: false });
      });
      addEventListener("orientationchange", function () { setTimeout(setH, 300); });
    })();
  </script>
  <link rel="stylesheet" href="styles.css">
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="https://unpkg.com/suncalc@1.9.0/suncalc.js"></script>
  <script src="https://unpkg.com/lz-string@1.5.0/libs/lz-string.min.js"></script>
</head>
<body>
  <div id="app" class="app">
    <!-- Explore -->
    <section id="screen-explore" class="screen is-active" aria-label="Explore">
      <div class="search-wrap">
        <div class="search">
          <span data-icon="search"></span>
          <input id="search" type="search" placeholder="Search anything" autocomplete="off" enterkeyhint="search" aria-label="Search places, areas, food">
          <button id="search-clear" class="icon-btn small" hidden aria-label="Clear search"><span data-icon="close"></span></button>
          <button id="btn-near" class="icon-btn small search-locate" aria-label="Show where I am"><span data-icon="locate" data-size="22"></span></button>
        </div>
        <div id="suggest" class="suggest" hidden></div>
        <div id="chips" class="chips" role="toolbar" aria-label="Filters"></div>
      </div>

      <div id="map" class="map" aria-label="Map"></div>
      <div id="map-loading" class="map-loading" role="status"><span class="ml-pill"><span class="ml-spin" aria-hidden="true"></span>Loading the map…</span></div>
      <div class="map-buttons">
        <!-- Vibe: the main map action. The glyph is a tiny patchwork of neighbourhoods in the vibe-map colours,
             i.e. a preview of what the button does (colour the map by what each area feels like). -->
        <button id="btn-vibe" class="vibe-btn" aria-label="Neighbourhood vibe map" aria-pressed="false">
          <svg class="vibe-patch" viewBox="0 0 24 24" aria-hidden="true">
            <defs><clipPath id="vp-clip"><rect width="24" height="24" rx="7"/></clipPath></defs>
            <g clip-path="url(#vp-clip)">
              <path d="M0 0H14L11 10.5L0 12.5Z" style="fill: var(--vibe-bohemian)"/>
              <path d="M14 0H24V9L11 10.5Z" style="fill: var(--vibe-village)"/>
              <path d="M0 12.5L11 10.5L13.5 24H0Z" style="fill: var(--vibe-monumental)"/>
              <path d="M11 10.5L24 9V24H13.5Z" style="fill: var(--vibe-nightlife)"/>
              <path class="vp-seams" d="M0 12.5L11 10.5L13.5 24M11 10.5L14 0M11 10.5L24 9" fill="none" stroke-width="1.6" stroke-linejoin="round"/>
            </g>
          </svg><span>Vibe</span>
        </button>
        <button id="btn-here" class="fab" aria-label="What's here? Tap, then tap the map" aria-pressed="false"><span data-icon="here" data-size="28"></span></button>
      </div>
      <div class="map-buttons-bottom">
        <button id="btn-north" class="fab north-btn" aria-label="Face north" hidden><svg class="north-needle" viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path class="nn-n" d="M12 3l3.6 9h-7.2z"/><path class="nn-s" d="M12 21l-3.6-9h7.2z"/></svg></button>
        <button id="btn-base" class="fab" aria-label="Change the map style" aria-expanded="false"><span data-icon="mapStyle"></span></button>
        <button id="btn-home" class="fab" aria-label="Centre on our flat"><span data-icon="home"></span></button>
      </div>
      <div id="here-hint" class="map-hint" hidden>Tap anywhere on the map</div>
      <div id="plans-legend" class="plans-legend" hidden></div>
      <div id="base-pop" class="base-pop" role="dialog" aria-label="Map style" hidden></div>
      <div id="map-credit" class="map-credit" aria-hidden="true">© OpenStreetMap · © CARTO</div>

      <section id="vibe-legend" class="vibe-panel" aria-label="Neighbourhood vibe legend" hidden></section>
      <section id="sheet" class="sheet" data-state="peek" aria-label="Places in view">
        <button class="sheet-handle" id="sheet-handle" aria-label="Drag or tap to resize the list"><span></span></button>
        <button id="sheet-bar" class="sheet-bar"><span id="sheet-bar-txt">Show places</span><span data-icon="chevronDown"></span></button>
        <div class="sheet-body" id="sheet-body">
          <div class="sheet-head">
            <h2 class="list-title-wrap"><span id="list-title">Top picks in view</span><span id="list-busy" class="ml-spin list-busy" role="status" aria-label="Updating" hidden></span></h2>
            <button id="sheet-toggle" class="link-btn">See all</button>
          </div>
          <div id="cards" class="cards"></div>
          <div id="list" class="list"></div>
        </div>
      </section>
    </section>

    <!-- Saved -->
    <section id="screen-saved" class="screen" aria-label="Saved">
      <div class="page">
        <h1 class="page-title">Saved</h1>
        <div id="saved-tabs" class="seg" role="tablist" hidden></div>
        <div id="saved-top"></div>
        <div id="saved-list" class="saved-grid"></div>
      </div>
    </section>

    <!-- Plan -->
    <section id="screen-plan" class="screen" aria-label="Routes">
      <div class="page routes-page">
        <!-- Routes (rebuilt 2026-11-06): no mini map (the Explore map shows a route), one quiet header per day,
             alternatives only when there is more than one. -->
        <div id="plan-tabs" class="day-seg" role="tablist" aria-label="Day"></div>
        <select id="plan-who" class="who" aria-label="Whose routes"></select>
        <div id="route-head" class="route-head"></div>
        <div id="route-chips" class="route-chips" role="tablist" aria-label="Routes for this day"></div>
        <div id="plan-body" class="timeline"></div>
        <div id="plan-tray"></div>
      </div>
    </section>

    <!-- More -->
    <section id="screen-more" class="screen" aria-label="More">
      <div class="page">
        <h1 class="page-title">More</h1>
        <!-- The countdown itself is the first thing on More (2026-11-06); tap it for the full splash with days + forecast. -->
        <button id="open-splash" class="count-card" aria-label="Countdown and trip forecast"></button>
        <h2 class="settings-title">App theme</h2>
        <div id="theme-picker" class="theme-picker" role="radiogroup" aria-label="App theme"></div>
        <div id="install-box"></div>
        <div class="more-row static"><span data-icon="offline"></span><span><b>Offline</b><small>Keep the map and photos on this phone</small></span></div>
        <div id="offline-box" class="offline-box"></div>
        <button id="open-credits" class="credits-tiny">Photos: Wikimedia Commons · Text: Wikipedia · Map © OpenStreetMap, CARTO</button>
      </div>
    </section>

    <!-- Splash: countdown + trip forecast -->
    <section id="splash" class="splash" aria-label="Welcome" hidden></section>

    <!-- Place card (overlay) -->
    <article id="place" class="place" hidden aria-modal="true" role="dialog" aria-labelledby="place-name"></article>

    <!-- Dialogs -->
    <div id="dialog" class="dialog" hidden role="dialog" aria-modal="true"><div class="dialog-card" id="dialog-card"></div></div>

    <nav class="tabbar" aria-label="Main">
      <button class="tab is-active" data-screen="explore"><span data-icon="compass"></span><span>Explore</span></button>
      <button class="tab" data-screen="saved"><span data-icon="heart"></span><span>Saved</span></button>
      <button class="tab" data-screen="plan"><span data-icon="routeMap"></span><span>Routes</span></button>
      <button class="tab" data-screen="more"><span data-icon="more"></span><span>More</span></button>
    </nav>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
