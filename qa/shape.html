<!doctype html><meta charset="utf-8"><title>Study area outline</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>body{margin:0;font:13px system-ui;background:#fff}svg{width:49%;height:96vh}</style>
<div id="o"></div>
<script>
// QA only: previous outline (v2) next to the current one, with every place as a dot.
const [x0, x1, y0, y1] = [28.86, 29.24, 40.94, 41.28], k = 84 / 111.1, W = 400, H = W * (y1 - y0) / ((x1 - x0) * k);
const P = ([x, y]) => `${((x - x0) / (x1 - x0) * W).toFixed(1)},${((y1 - y) / (y1 - y0) * H).toFixed(1)}`;
const draw = (fc, places, label) => {
  const g = fc.features[0].geometry; const rings = g.type === "Polygon" ? [g.coordinates[0]] : g.coordinates.map((p) => p[0]);
  const d = rings.map((r) => "M" + r.map(P).join("L") + "Z").join("");
  const dots = places.features.map((f) => { const [x, y] = P(f.geometry.coordinates).split(","); return `<circle cx="${x}" cy="${y}" r="${f.properties.category === "Food & drink" ? 0.6 : 1.3}" fill="${f.properties.category === "Food & drink" ? "#C4462E" : "#14213D"}"/>`; }).join("");
  return `<svg viewBox="0 0 ${W} ${H}"><text x="8" y="18">${label}</text><path d="${d}" fill="#1F4FA322" stroke="#1F4FA3" stroke-width="1.5"/>${dots}</svg>`;
};
Promise.all(["../data/raw/study_area_v3a.geojson", "../data/study_area.geojson", "../data/places.geojson"].map((u) => fetch(u).then((r) => r.json())))
  .then(([a, b, p]) => (document.getElementById("o").innerHTML = draw(a, p, "v2") + draw(b, p, "v3")));
</script>
