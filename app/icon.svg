<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Istanbul Explorer app icon (2026-11-06, v4, after Cem's draft): a map pin holding a mosque at sunset over the
       Bosphorus, on a plain blue ground. -->
  <defs>
    <linearGradient id="bgb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1D3F94"/><stop offset="1" stop-color="#0E1E4F"/></linearGradient>
    <linearGradient id="skyb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2B2A6B"/><stop offset=".35" stop-color="#8A3F6E"/><stop offset=".68" stop-color="#E8704A"/><stop offset=".86" stop-color="#F7A23F"/>
    </linearGradient>
    <linearGradient id="seab" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1E4FA8"/><stop offset="1" stop-color="#10306E"/></linearGradient>
    <radialGradient id="glowb"><stop offset=".55" stop-color="#FFD25E"/><stop offset=".78" stop-color="#FBB848" stop-opacity=".75"/><stop offset="1" stop-color="#F7A23F" stop-opacity="0"/></radialGradient>
    <filter id="softb" x="-20%" y="-300%" width="140%" height="700%"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="wideb" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="12"/></filter>
    <clipPath id="pinb"><path d="M256 470L134.9 333.6A162 162 0 1 1 377.1 333.6Z"/></clipPath>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bgb)"/>
  <g clip-path="url(#pinb)">
    <rect x="60" y="50" width="392" height="290" fill="url(#skyb)"/>
    <circle cx="256" cy="284" r="104" fill="url(#glowb)"/>
    <g fill="#141F47">
      <path d="M196 290a60 56 0 0 1 120 0z"/>
      <rect x="254" y="218" width="4" height="20" rx="2"/><circle cx="256" cy="239" r="5"/>
      <path d="M263 215a8.5 8.5 0 1 1-8-11 6.6 6.6 0 1 0 8 11z"/>
      <rect x="192" y="286" width="128" height="20"/>
      <path d="M156 314a20 18 0 0 1 40 0zM316 314a20 18 0 0 1 40 0z"/>
      <path d="M180 306a14 12 0 0 1 28 0zM304 306a14 12 0 0 1 28 0z"/>
      <rect x="134" y="312" width="244" height="26"/><rect x="150" y="304" width="212" height="10"/>
      <path d="M148 128l9 42h-18z"/><rect x="141" y="168" width="14" height="170"/><rect x="136" y="214" width="24" height="7" rx="2"/><rect x="137" y="262" width="22" height="7" rx="2"/>
      <path d="M364 128l9 42h-18z"/><rect x="357" y="168" width="14" height="170"/><rect x="352" y="214" width="24" height="7" rx="2"/><rect x="353" y="262" width="22" height="7" rx="2"/>
